[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-timeseries-recommender"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "torch>=2.0"]

[project.optional-dependencies]
mysql = ["pymysql>=1.1"]

[tool.setuptools.packages.find]
include = ["workflow*", "gru4rec_standard*", "university_recommender*"]

[tool.setuptools.package-data]
university_recommender = ["*_definition.json", "README.md"]
gru4rec_standard = ["examples/*_definition.json", "examples/data/*.csv", "examples/README.md"]
